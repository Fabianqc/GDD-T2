name: Deploy Backend to Server

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend via SSH & PM2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Actualizando repositorio en el servidor..."
            cd ~/GDD-T2
            git pull origin main

            echo "📦 Verificando entorno virtual y dependencias..."
            cd ~/GDD-T2/Backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "🔄 Reiniciando servicio en PM2..."
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi
            export PATH=$PATH:/usr/local/bin:/usr/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.npm-global/bin
            
            PM2_CMD=$(which pm2 2>/dev/null || echo "pm2")
            # Reinicia API + worker de recordatorios (definidos en ecosystem.config.js)
            $PM2_CMD restart ecosystem.config.js --update-env || $PM2_CMD start ecosystem.config.js
            $PM2_CMD save

            echo "✅ ¡Despliegue de Backend completado exitosamente!"
